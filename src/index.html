<!doctype html>
<html lang="en">

<head>
    <title>SuperSplat Viewer</title>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <base href="/" />
    <script>
        window.REALESTATE3D_API_BASE = 'https://orcaz.runasp.net';
    </script>
    <link rel="stylesheet" href="./index.css" />

    <!--
            The viewer fills whatever contains it. In the standalone document that is the page,
            so make the page fill the viewport. This lives here rather than in index.css because
            a host page linking the stylesheet must not have its own body restyled.
        -->
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>

    <!--
            Single injection seam. `renderViewerHtml` replaces the contents of this block to
            supply asset urls and inline settings, so anything generating a page around the
            viewer goes through that function rather than pattern-matching this document.
            Left as `null` for the standalone case.
        -->
    <script type="application/json" id="sse-bootstrap">
            null
        </script>

    <script type="module">
        const createImage = (url) => {
            const img = new Image();
            img.src = url;
            return img;
        };

        const url = new URL(location.href);

        // Embedder-supplied defaults. URL params take precedence over the asset urls below,
        // so an embed can still be overridden per-instance (e.g. `?skybox=` to preview a
        // different sky). Inline `settings` is the exception: it wins over `?settings=`, so a
        // published experience cannot be repointed at someone else's settings file.
        const bootstrap = JSON.parse(document.getElementById('sse-bootstrap').textContent) ?? {};

        const posterUrl = url.searchParams.get('poster') ?? bootstrap.posterUrl ?? null;
        const skyboxUrl = url.searchParams.get('skybox') ?? bootstrap.skyboxUrl ?? null;
        const collisionUrl =
            url.searchParams.get('collision') ?? url.searchParams.get('voxel') ?? bootstrap.collisionUrl ?? null;
        const settingsUrl = url.searchParams.get('settings') ?? bootstrap.settingsUrl ?? './settings.json';
        const contentParam = url.searchParams.get('content') ?? bootstrap.contentUrl ?? null;
        const contentUrl = contentParam ?? './scene.compressed.ply';
        // the bootstrap's alone: a url param would let a link run any wasm in this origin
        const gsafDecoderUrl = bootstrap.gsafDecoderUrl ?? null;
        const zstdDecoderUrl = bootstrap.zstdDecoderUrl ?? null;

        // Names the bootstrap's contentUrl when the url itself has no usable name (a data:
        // uri, say) — the splat format is chosen by the name's extension. Ignored when a
        // ?content= override replaces the url it describes.
        const contentFilename = url.searchParams.has('content') ? null : (bootstrap.contentFilename ?? null);

        const renderer = url.searchParams.has('webgl') ? 'webgl' : 'webgpu';

        const budgetParam = url.searchParams.get('budget');
        const budget = budgetParam !== null ? Number(budgetParam) : undefined;

        // The engine's octree and lcc2 parsers fetch lod-meta.json and .lcc2 files themselves
        // and ignore a prefetched response, so starting one here would download the metadata
        // twice, and the spz parser cannot read a prefetched response. Every other splat
        // parser consumes it, so they keep the head start. `isPrefetchable` in src/index.ts
        // applies the same rule for embedders that do not pass `contents`.
        const contentName = (
            contentFilename ??
            new URL(contentUrl, location.href).pathname.split('/').pop() ??
            ''
        ).toLowerCase();
        const prefetchContent =
            Boolean(contentParam) &&
            contentName !== 'lod-meta.json' &&
            !contentName.endsWith('.lcc2') &&
            !contentName.endsWith('.spz') &&
            !contentName.endsWith('.glb');

        // createViewer's options, minus the container and the settings. The poster image and
        // the content fetch start here, before the module bundle has arrived.
        const sseOptions = {
            contentUrl,
            contentFilename,
            posterUrl,
            skyboxUrl,
            collisionUrl,
            gsafDecoderUrl,
            zstdDecoderUrl,
            poster: posterUrl && createImage(posterUrl),
            contents: prefetchContent ? fetch(contentUrl) : undefined,
            ui: !url.searchParams.has('noui'),
            reticle: url.searchParams.has('reticle'),
            noanim: url.searchParams.has('noanim'),
            nofx: url.searchParams.has('nofx'),
            hpr: url.searchParams.has('hpr')
                ? ['', '1', 'true', 'enable'].includes(url.searchParams.get('hpr'))
                : undefined,
            ministats: url.searchParams.has('ministats'),
            colorize: url.searchParams.has('colorize'),
            renderer,
            aa: url.searchParams.has('aa')
                ? ['', '1', 'true', 'enable'].includes(url.searchParams.get('aa'))
                : undefined,
            stochastic: url.searchParams.has('stochastic')
                ? url.searchParams.get('stochastic') === 'mobile'
                    ? 'mobile'
                    : url.searchParams.get('stochastic') === 'off'
                        ? 'off'
                        : true
                : false,
            splatSource: url.searchParams.get('splatSource') ?? undefined,
            variant: url.searchParams.get('variant') ?? undefined,
            budget,
            framesInFlight: url.searchParams.has('fif') ? Number(url.searchParams.get('fif')) : undefined,
            heatmap: url.searchParams.has('heatmap'),
            fullload: url.searchParams.has('fullload'),
            vr: url.searchParams.has('vr'),
            debug: url.searchParams.has('debug'),
            lang: url.searchParams.get('lang'),
            // the standalone document is the one place the window.* hooks belong
            exposeGlobals: true
        };

        window.sse = {
            options: sseOptions,
            hasContent: Boolean(contentParam),
            settings: bootstrap.settings ?? fetch(settingsUrl).then((response) => (response.ok ? response.json() : {})).catch(() => ({}))
        };
    </script>
    </head>

<body>
    <!-- Application Script -->
    <script type="module">
        import { createViewer } from './index.js';

        const { options, settings, hasContent } = window.sse;
        const pageUrl = new URL(location.href);

        const token =
            pageUrl.searchParams.get('token') ||
            pageUrl.searchParams.get('shareToken') ||
            (pageUrl.pathname.match(/\/(?:v|share)\/([a-zA-Z0-9_-]+)/)?.[1] ?? null);
        const previewScanId = pageUrl.searchParams.get('previewScanId') || pageUrl.searchParams.get('scanId');

        if (hasContent) {
            createViewer({ container: document.body, settings, ...options });
        } else if (token || previewScanId) {
            try {
                const { initRealEstateViewer } = await import('./realestate.js');
                await initRealEstateViewer(createViewer, { container: document.body, url: pageUrl });
            } catch (err) {
                console.error('Failed to load RealEstate viewer:', err);
                showLauncher(err.message);
            }
        } else {
            showLauncher();
        }

        function showLauncher(errorMsg) {
            const portal = document.createElement('div');
            portal.id = 're-portal';
            portal.style.cssText =
                'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);padding:20px;z-index:9999;font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;direction:rtl;';

            const card = document.createElement('div');
            card.style.cssText =
                'max-width:540px;width:100%;background:rgba(30,41,59,0.75);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);border-radius:18px;padding:32px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.6);text-align:center;box-sizing:border-box;';

            const errHtml = errorMsg
                ? `<div style="background:rgba(239,68,68,0.2);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;padding:10px;border-radius:8px;font-size:12px;margin-bottom:16px;">${errorMsg}</div>`
                : '';

            card.innerHTML = `
                    <div style="font-size:46px;margin-bottom:8px;">🏢</div>
                    <h1 style="font-size:22px;font-weight:700;margin:0 0 6px;color:#fff;">مستعرض العقارات ثلاثي الأبعاد</h1>
                    <p style="font-size:13px;color:#94a3b8;margin:0 0 20px;line-height:1.5;">RealEstate 3D Viewer &middot; يدعم نماذج .glb المجسمة و Gaussian Splatting</p>
                    ${errHtml}
                    <div style="margin-bottom:16px;text-align:right;">
                        <label style="display:block;font-size:12px;font-weight:600;color:#cbd5e1;margin-bottom:6px;">أدخل رمز المشاركة أو رابط المشهد:</label>
                        <div style="display:flex;gap:8px;">
                            <input id="scene-input" type="text" placeholder="مثال: /v/share_token أو رابط ملف .glb / .sog / .ply" style="flex:1;background:rgba(15,23,42,0.8);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:10px 12px;color:#fff;font-size:13px;outline:none;box-sizing:border-box;" />
                            <button id="btn-load-scene" style="background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:13px;">استعراض</button>
                        </div>
                    </div>
                    <div id="drop-zone" style="border:2px dashed rgba(255,255,255,0.2);border-radius:12px;padding:20px 16px;margin-bottom:18px;background:rgba(15,23,42,0.4);cursor:pointer;transition:border-color 0.2s;">
                        <div style="font-size:24px;margin-bottom:4px;">📁</div>
                        <div style="font-size:13px;font-weight:600;color:#e2e8f0;">اسحب وأفلت ملف .glb أو .sog أو .ply أو .splat هنا</div>
                        <div style="font-size:11px;color:#64748b;margin-top:2px;">للمعاينة ثلاثية الأبعاد الفورية داخل المتصفح بدون سيرفر</div>
                        <input id="file-input" type="file" accept=".glb,.ply,.sog,.splat,.spz" style="display:none;" />
                    </div>
                    <div style="border-top:1px solid rgba(255,255,255,0.1);padding-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b;">
                        <span>PlayCanvas SuperSplat Engine</span>
                        <button id="btn-demo" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:#cbd5e1;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:11px;">تجربة مشهد افتراضي (Demo)</button>
                    </div>
                `;

            portal.appendChild(card);
            document.body.appendChild(portal);

            const sceneInput = card.querySelector('#scene-input');
            const btnLoad = card.querySelector('#btn-load-scene');
            const dropZone = card.querySelector('#drop-zone');
            const fileInput = card.querySelector('#file-input');
            const btnDemo = card.querySelector('#btn-demo');

            const handleOpen = (val) => {
                val = (val || '').trim();
                if (!val) return;
                if (val.startsWith('http://') || val.startsWith('https://')) {
                    const lowerVal = val.toLowerCase();
                    if (
                        lowerVal.includes('.glb') ||
                        lowerVal.includes('.ply') ||
                        lowerVal.includes('.sog') ||
                        lowerVal.includes('.splat') ||
                        lowerVal.includes('.spz')
                    ) {
                        location.href = '?content=' + encodeURIComponent(val);
                    } else {
                        location.href = val;
                    }
                } else if (val.startsWith('/v/') || val.startsWith('v/')) {
                    location.href = '?token=' + encodeURIComponent(val.replace(/^\/?v\//, ''));
                } else {
                    location.href = '?token=' + encodeURIComponent(val);
                }
            };

            btnLoad.onclick = () => handleOpen(sceneInput.value);
            sceneInput.onkeydown = (e) => {
                if (e.key === 'Enter') handleOpen(sceneInput.value);
            };

            dropZone.onclick = () => fileInput.click();
            fileInput.onchange = (e) => {
                const file = e.target.files?.[0];
                if (file) {
                    portal.remove();
                    const blobUrl = URL.createObjectURL(file);
                    createViewer({
                        container: document.body,
                        settings,
                        contentUrl: blobUrl,
                        contentFilename: file.name,
                        ...options
                    });
                }
            };

            dropZone.ondragover = (e) => {
                e.preventDefault();
                dropZone.style.borderColor = '#3b82f6';
            };
            dropZone.ondragleave = () => {
                dropZone.style.borderColor = 'rgba(255,255,255,0.2)';
            };
            dropZone.ondrop = (e) => {
                e.preventDefault();
                dropZone.style.borderColor = 'rgba(255,255,255,0.2)';
                const file = e.dataTransfer.files?.[0];
                if (file) {
                    portal.remove();
                    const blobUrl = URL.createObjectURL(file);
                    createViewer({
                        container: document.body,
                        settings,
                        contentUrl: blobUrl,
                        contentFilename: file.name,
                        ...options
                    });
                }
            };

            btnDemo.onclick = () => {
                location.href =
                    '?content=https://raw.githubusercontent.com/playcanvas/supersplat-viewer/main/test/assets/test.ply';
            };
        }
    </script>
</body>

</html>
